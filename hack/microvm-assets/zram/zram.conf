# zram swap inside the Substrate microVM guest (Linux 6.18 symbol names).
CONFIG_ZRAM=y
CONFIG_ZRAM_BACKEND_LZ4=y
CONFIG_ZRAM_BACKEND_ZSTD=y
CONFIG_ZRAM_DEF_COMP_LZ4=y
# PSI is built in but off by default (mem_agent.conf). Turn it on here as well
# as via psi=1 on the kernel command line to expose /proc/pressure/* in the guest.
# CONFIG_PSI_DEFAULT_DISABLED is not set
